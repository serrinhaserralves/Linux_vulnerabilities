name: update-portal
on:
  push:
    branches: [main]
  schedule: [{cron: "17 */6 * * *"}]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        with:
          path: vulns.db
          key: "vulns-${{ github.run_id }}"
          restore-keys: "vulns-"

      - run: pip install defusedxml

      - run: python -m unittest discover -s tests -v

      - run: python collector/collector.py
        env:
          VULN_DB: vulns.db
          VULN_JSON: site/vulns.json
          NVD_API_KEY: "${{ secrets.NVD_API_KEY }}"
          SITE_URL: "${{ vars.SITE_URL }}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
