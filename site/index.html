<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linux, Cloud-Native &amp; SAP Vulnerability Intelligence</title>
<meta name="description" content="Recent vulnerabilities for Linux, Kubernetes, containers and SAP, prioritised by active exploitation, with mitigations.">
<meta property="og:title" content="Linux, Cloud-Native &amp; SAP Vulnerability Intelligence"><meta property="og:description" content="Exploited and critical vulnerabilities with mitigations."><meta name="theme-color" content="#5b5bd6">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5fb;--surface:#fff;--text:#161a2e;--muted:#5f6784;--line:#e1e5f2;--accent:#5b5bd6;--accent2:#0ea5a4;--accent-bg:#ecebff;
--crit:#d92d3a;--high:#e5640c;--med:#b07d00;--low:#3558d6;--kev:#8e3fc4;--ok:#16a34a;--warn:#b45309;--info:#0b7bd1;--g1:#5b5bd6;--g2:#0ea5a4;--shadow:0 1px 2px rgba(22,26,46,.05),0 4px 14px rgba(22,26,46,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b0e1a;--surface:#141829;--text:#e8eaf6;--muted:#9aa2c4;--line:#252b45;--accent:#8b8bff;--accent2:#2dd4bf;--accent-bg:#1c2040;--crit:#ff6b75;--high:#ff9b4a;--med:#f5d24a;--low:#7ea2ff;--kev:#c78cf5;--ok:#4ade80;--warn:#fbbf24;--info:#60a5fa;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b0e1a;--surface:#141829;--text:#e8eaf6;--muted:#9aa2c4;--line:#252b45;--accent:#8b8bff;--accent2:#2dd4bf;--accent-bg:#1c2040;--crit:#ff6b75;--high:#ff9b4a;--med:#f5d24a;--low:#7ea2ff;--kev:#c78cf5;--ok:#4ade80;--warn:#fbbf24;--info:#60a5fa;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.nav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;gap:12px}
.brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;display:grid;place-items:center;font:700 12px ui-monospace,Menlo,monospace}
.nav small{color:var(--muted)}
.hero{margin:22px 0 0;padding:26px 24px;border-radius:16px;background:linear-gradient(120deg,var(--g1),var(--g2));color:#fff;box-shadow:var(--shadow)}
h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.01em}
.hero p{margin:6px 0 0;max-width:660px;opacity:.92}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:28px;font-weight:700;line-height:1.1;color:var(--c)}
.stat span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.s0{--c:var(--accent)}.s1{--c:var(--crit)}.s2{--c:var(--high)}.s3{--c:var(--kev)}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
input,select{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
input{flex:1;min-width:200px}
label.k{display:flex;align-items:center;gap:6px;color:var(--muted);padding:0 4px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:5px 14px;cursor:pointer;font:inherit;font-size:13px}
.tab.on{background:linear-gradient(120deg,var(--g1),var(--g2));color:#fff;border-color:transparent}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600;background:var(--accent-bg)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr.r{cursor:pointer}tr.r:hover td{background:var(--accent-bg)}
tr:last-child td{border-bottom:0}
.id{font:600 13px ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,currentColor 15%,transparent);white-space:nowrap}
.Critical{color:var(--crit)}.High{color:var(--high)}.Medium{color:var(--med)}.Low{color:var(--low)}.KEV{color:var(--kev)}
.muted{color:var(--muted)}
.det
